name: CI

on:
  push:
    branches: [master, "revival/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check quantropy tests
      - name: Test
        run: pytest -q

  book:
    # The no-rot gate (NFR9): every curriculum lesson executes against the real
    # library; a broken example fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[book]"
      - name: Build curriculum (executes all lessons)
        run: jupyter-book build curriculum -W -n --keep-going
      - name: Upload book HTML
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-html
          path: curriculum/_build/html
